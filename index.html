:root{--bg:#fff;--fg:#231F20;--mut:#706D6E;--soft:#f4f4f4;--soft2:#dedede;--circ:#CAC9C9;--inv:#231F20;--oninv:#fff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#9d9d9d;--soft:#161616;--soft2:#2e2e2e;--circ:#2e2e2e;--inv:#fff;--oninv:#000}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#9d9d9d;--soft:#161616;--soft2:#2e2e2e;--circ:#2e2e2e;--inv:#fff;--oninv:#000}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Acumin HPSI','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:20px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-weight:300;font-style:normal;font-variation-settings:"slnt" 12;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:-.005em}
p{margin:0 0 14px}
.mut{color:var(--mut)}
b,strong{font-weight:500}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

/* Kopf */
.top{background:#000;color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.logo{display:flex;align-items:center;height:48px}
.logo .lt{background:#fff;color:#000;height:100%;display:flex;align-items:center;padding:0 26px 0 20px;transform:skewX(-12deg);margin-left:-8px}
.logo .lt span{display:block;transform:skewX(12deg);font-style:normal;font-variation-settings:"slnt" 12;font-weight:300;font-size:11px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.logo .mk{font-weight:300;font-style:normal;font-variation-settings:"slnt" 12;font-size:50px;line-height:1;letter-spacing:-.02em;margin-left:10px}
.logoimg{height:48px;width:auto;display:block}
#sv{font-size:15px;color:#bdbdbd;text-align:right}

/* Hero */
.hero{position:relative;overflow:hidden;padding:44px 0 36px}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;z-index:0}
.hero::before{width:380px;height:380px;background:var(--circ);opacity:.8;right:-90px;top:-110px}
.hero::after{width:230px;height:230px;background:var(--circ);right:150px;top:90px;opacity:.8;mix-blend-mode:multiply}
.hero .wrap{position:relative;z-index:1}
.kicker{display:inline-block;position:relative;isolation:isolate;padding:6px 22px;margin-bottom:16px;font-weight:300;font-style:normal;font-variation-settings:"slnt" 12;font-size:22px;text-transform:uppercase;color:var(--oninv)}
.kicker::before{content:'';position:absolute;inset:0;background:var(--inv);transform:skewX(-12deg);z-index:-1}
.hero h1{font-size:clamp(54px,14vw,128px);line-height:.84}
.hero .lead{max-width:34em;margin-top:22px;font-size:23px}
@keyframes sweep{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.hero h1{animation:sweep .7s cubic-bezier(.2,.8,.2,1) both}.kicker{animation:sweep .5s cubic-bezier(.2,.8,.2,1) both}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--fg)}
.tabs .in{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;max-width:980px;margin:0 auto;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tab{position:relative;isolation:isolate;border:0;background:none;padding:7px 18px;font-weight:500;font-size:18px;white-space:nowrap;cursor:pointer}
.tab::before{content:'';position:absolute;inset:0;background:var(--soft);transform:skewX(-12deg);z-index:-1}
.tab.on{color:var(--oninv)}
.tab.on::before{background:var(--inv)}

/* Inhalt */
main{padding:34px 0 80px;min-height:60vh}
.mh h2{font-size:clamp(44px,10vw,84px);margin:8px 0 10px}
.mh .meta{font-size:19px;color:var(--mut);margin-bottom:6px}
.tag{display:inline-block;position:relative;isolation:isolate;padding:3px 16px;font-weight:500;font-size:17px;color:var(--oninv)}
.tag::before{content:'';position:absolute;inset:0;background:var(--inv);transform:skewX(-12deg);z-index:-1}
.band{display:flex;align-items:center;gap:14px;font-size:clamp(30px,6vw,44px);margin:54px 0 6px}
.band::before{content:'';flex:none;width:14px;height:1.05em;background:var(--fg);transform:skewX(-12deg)}
.sub{font-size:22px;color:var(--mut);margin:0 0 24px}
h3.h{font-size:26px;margin:34px 0 8px}
.hint{font-size:18px;color:var(--mut);margin:0 0 12px}
.card{background:var(--soft);padding:20px 22px;margin:0 0 18px}
.card.line{background:transparent;border:1px solid var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr}}
.f{display:block;margin:0 0 16px}
.fl{display:block;font-weight:500;font-size:19px;margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;font-size:20px;padding:10px 12px;border-radius:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical;min-height:84px;line-height:1.35}
::placeholder{color:var(--mut);opacity:.9}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:9px 18px;font-weight:500;font-size:19px;cursor:pointer;line-height:1.1}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:5px 11px;font-size:17px}
.btn.warn{background:var(--bg);color:var(--fg);border-style:dashed}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;margin:0 0 14px;border:1px solid var(--fg)}
.seg button{border:0;background:var(--bg);padding:7px 18px;font-weight:500;font-size:18px;cursor:pointer}
.seg button.on{background:var(--inv);color:var(--oninv)}
.chip{border:1px solid var(--fg);background:var(--bg);padding:5px 14px;font-size:18px;font-weight:500;cursor:pointer;border-radius:999px;line-height:1.15}
.chip.on{background:var(--inv);color:var(--oninv)}
.chip.s{border-style:dashed;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}

/* Regler */
.rr{margin:0 0 18px}
.rl{font-weight:500;font-size:19px}
.rt{position:relative}
.re{display:flex;justify-content:space-between;font-size:16px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;position:relative;z-index:2;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fg);border:0;margin-top:-9.5px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:0}
.gh{position:absolute;top:50%;width:20px;height:20px;border:2px solid var(--mut);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.legend{font-size:16px;color:var(--mut);margin:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 10px}
.dot.fill{background:var(--fg);margin-left:0}
.dot.ring{border:3px solid var(--mut)}
.trk{position:relative;height:30px}
.trk .ln{position:absolute;top:50%;height:3px;background:var(--mut);transform:translateY(-50%)}
.trk .base{position:absolute;left:10px;right:10px;top:50%;height:1px;background:var(--soft2)}
.trk .m{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%)}
.trk .m.a{border:3px solid var(--mut);background:var(--bg)}
.trk .m.b{background:var(--fg)}

/* Listen */
.vals li,.blk,.entry{list-style:none}
.vals{padding:0;margin:0 0 16px}
.vals li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft2)}
.rk{flex:none;width:34px;height:34px;border-radius:50%;background:var(--inv);color:var(--oninv);display:grid;place-items:center;font-weight:300;font-style:normal;font-variation-settings:"slnt" 12}
.vn{flex:1;font-weight:500;font-size:22px}
.blk{display:grid;grid-template-columns:150px 1fr 90px 110px auto;gap:10px;align-items:end;padding:12px;background:var(--soft);margin:0 0 8px}
.blk label{font-size:15px;color:var(--mut);display:block}
.blk .mv{display:flex;gap:6px}
@media (max-width:760px){.blk{grid-template-columns:1fr 1fr}.blk .nm{grid-column:1/-1}.blk .mv{grid-column:1/-1}}
#tlbar{display:flex;gap:2px;height:54px;margin:10px 0 6px}
.tb{display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--inv);color:var(--oninv);font-size:15px;font-weight:500;padding:0 4px;min-width:0}
.tb:nth-child(even){background:var(--mut)}
.tb.empty{flex:1;background:var(--soft);color:var(--mut);font-weight:400}
.tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlcurve{width:100%;height:auto;display:block}
.cnt{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft2)}
.cnt .n{width:48px;text-align:center;font-weight:300;font-style:normal;font-variation-settings:"slnt" 12;font-size:34px;line-height:1}
.cnt .l{flex:1;font-weight:500}
.cnt .btn{width:44px;height:44px;padding:0;font-size:26px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;cursor:pointer}
.chk input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--fg);flex:none}
.dcard{border:1px solid var(--fg);background:var(--bg);text-align:left;padding:14px 16px;cursor:pointer;font-size:19px}
.dcard.on{background:var(--inv);color:var(--oninv)}
.dcard b{display:block;font-size:21px}
.entry{background:var(--soft);padding:16px 18px;margin:0 0 12px}
.entry .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut)}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.quote{border-left:6px solid var(--fg);padding:2px 0 2px 14px;margin:0 0 12px;font-size:22px;font-weight:500}
.gap{font-size:21px;font-weight:500;padding:14px 16px;border:1px solid var(--fg);margin:6px 0 0}
#radar svg,.radar svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}

/* Karten Start */
.mcards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:26px 0 8px}
@media (max-width:640px){.mcards{grid-template-columns:1fr}}
.mc{display:flex;flex-direction:column;gap:6px;padding:22px;background:var(--soft);border:0;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.mc::after{content:'';position:absolute;right:-34px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:var(--soft2)}
.mc>*{position:relative;z-index:1}
.mc h3{font-size:34px}
.mc .d{color:var(--mut);font-size:18px}
.mc .p{font-weight:500;font-size:18px}
.steps{padding:0;margin:0;list-style:none;display:grid;gap:12px}
.steps li{padding-left:20px;position:relative}
.steps li::before{content:'';position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--fg)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;flex-wrap:wrap}
.thumb{max-width:100%;max-height:300px;display:block;margin-bottom:8px;border:1px solid var(--fg)}
.fcard{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);padding:14px 16px;margin:0 0 10px}
.fcard .fi{min-width:0;flex:1}
.fcard .fn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agc{background:var(--soft);margin:0 0 10px}
.agi{display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;cursor:pointer;color:var(--fg)}
.agi::after{content:'';flex:none;width:9px;height:9px;margin:8px 2px 0 auto;border-right:1.5px solid var(--fg);border-bottom:1.5px solid var(--fg);transform:rotate(45deg)}
.agi[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:12px}
.agdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--fg);margin:9px 6px 0 auto}
.agb{padding:2px 16px 16px}
.thumb{cursor:zoom-in}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:70;padding:16px}
.ovc{background:var(--bg);color:var(--fg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.ovc textarea{width:100%;font:inherit;border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:10px}
.cm{background:var(--soft);padding:20px 22px;margin:18px 0 0}
.cm .cn{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:4px 0 6px}
.cm .cp{font-size:15px;color:var(--mut)}
.cm ul{list-style:none;padding:0;margin:14px 0 0}
.cm li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--fg)}
.cm .fine{font-size:15px;color:var(--mut);margin:14px 0 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:60;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;display:block}
.lb button{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.agrow{display:flex;gap:14px;padding:6px 4px;color:var(--mut)}.agrow b{width:130px;flex:none;font-weight:500}
.agh{display:flex;gap:16px;margin-bottom:12px}.agt{flex:none;width:76px;font-weight:300;font-style:normal;font-variation-settings:"slnt" 12;font-size:32px;line-height:1}.agx{font-weight:500;font-size:23px;line-height:1.15}
body.can-dl .no-dl{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--oninv);padding:10px 20px;font-weight:500;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
footer{border-top:1px solid var(--fg);padding:22px 0 40px;color:var(--mut);font-size:17px}

h1,h2,h3,h4{font-weight:400;text-transform:none;letter-spacing:0;line-height:1.05}

.hero h1{font-size:clamp(46px,10.5vw,96px);line-height:.98;font-weight:300}

.band::before{width:5px;height:.85em}
h3.h{font-size:23px;font-weight:500;margin:30px 0 8px}
.mc h3{font-size:30px;font-weight:400}
.tab{font-weight:400;font-size:17px;padding:6px 14px}
.tab::before{background:transparent}
.tab.on{color:var(--fg);font-weight:500}

.btn.sm{padding:4px 10px;font-size:16px}

.rl{font-size:18px;font-weight:500}
.rk{font-weight:400}
.vn{font-weight:400}
.cnt .l{font-weight:400}
.cnt .n{font-weight:300;font-size:30px}
.agt{font-weight:300;font-size:28px}

 fb:{n:'Fußball',rows:null,c:[
  {n:'Jürgen Klopp',v:[9,8,10,9,7,1],t:'Gegenpressing und Tempo nach Ballgewinn, sofort Richtung Tor. Gegen den Ball sehr klar geregelt, im letzten Drittel darf Chaos entstehen.',p:'Emotional, nahbar und mitreißend. Er führt über Beziehung und Energie.'},
  {n:'Pep Guardiola',v:[1,8,2,10,2,3],t:'Positionsspiel mit klarem Plan für jede Zone. Geduldiger Aufbau, Ballbesitz sichern und nach Verlust den Ball innerhalb weniger Sekunden zurückholen.',p:'Detailbesessen und fordernd. Er führt Spielerinnen und Spieler durch Strukturen.'},
  {n:'Fabian Hürzeler',v:[4,9,6,10,6,3],t:'Ballbesitz mit vertikalen Impulsen, hohes Gegenpressing und flexible Strukturen im Aufbau. Die Idee bleibt, die Staffelung passt sich dem Gegner an.',p:'Jung, klar in der Ansprache und stark in der Beziehung zu seinen Spielern.'},
  {n:'Xabi Alonso',v:[3,4,6,4,6,4],t:'In Leverkusen ruhiger Ballbesitz durch die Mitte mit 3-4-2-1, wenige Flanken und ein kompakter Block ohne wildes Gegenpressing. Der Ballbesitz stieg in seiner ersten Saison von 51 auf rund 59 Prozent.',p:'Ruhig, klar und überzeugt von seinem Weg. Er lehnte Liverpool und Bayern ab, um in Leverkusen weiterzuarbeiten.'},
  {n:'Julian Nagelsmann',v:[7,7,7,7,3,6],t:'Taktischer Tüftler mit vielen Systemen, der Formationen an den Gegner anpasst. Gordon Herbert beschreibt, dass er wenige Regeln setzt, diese aber wichtig sind.',p:'Gilt als analytisch und kommunikativ, mit hohem Anspruch an die Detailarbeit.'},
  {n:'Diego Simeone',v:[8,2,9,3,3,1],t:'Kompakter Block, Geduld ohne Ball, dann Tempo nach dem Gewinn. Geschlossenheit und Disziplin stehen über allem.',p:'Leidenschaftlich an der Seitenlinie und kompromisslos in der Haltung.'},
  {n:'Carlo Ancelotti',v:[5,2,6,3,10,7],t:'Wenige Vorgaben, viel Vertrauen. Eine stabile Basis, innerhalb derer die Besten frei entscheiden.',p:'Ruhig, humorvoll und beziehungsorientiert.'},
  {n:'Marcelo Bielsa',v:[9,10,8,6,1,1],t:'Mann gegen Mann über das ganze Feld, kompromisslos vertikal und mit enormer Intensität. Fast jede Aktion ist einstudiert.',p:'Besessen von Detail und Vorbereitung, ein Perfektionist mit eigenem Weg.'}
 ]},

  {k:'freiGegen',t:'Entscheidungen in der Abwehr',l:'vorgegeben',r:'frei'}],c:[
  {n:'Alfred Gislason',v:[3,2,5,7,5,4],t:'Abwehr zuerst: Bei der Nominierung legt er großen Wert auf starke Abwehrspieler. Er passt die Taktik an das vorhandene Spielermaterial an und bereitet jeden Gegner mit intensiver Videoanalyse vor.',p:'Direkt, ehrlich und mit klarer Teamhierarchie. Er kritisiert nicht öffentlich, erklärt das Warum und ist mit den Jahren ruhiger geworden.'},
  {n:'Dagur Sigurdsson',v:[6,4,6,5,3,2],t:'Spieler brauchen ein System, das zu ihnen passt und an das sie glauben. Er setzt auf Vorbereitung, Routine und darauf, mehr zu arbeiten als der Gegner.',p:'Optimistisch, prozessorientiert und authentisch. Er verlangt, dass auch Kapitäne keine Sonderrolle einnehmen.'},
  {n:'Nikolaj Jacobsen',v:[8,7,10,7,4,3],t:'Aggressiver, schneller und präziser Tempohandball. Er übt vor Spielen immer wieder neue Systeme ein und plant nicht starr.',p:'Fordernd, laut und authentisch, ohne Sonderbehandlung selbst für Stars. Zugleich empathisch und mit echtem Interesse an den Menschen um die Mannschaft.'},
  {n:'Claude Onesta',v:[4,6,6,4,9,6],t:'Eine erfahrene Achse mit gezielt eingebauten jungen Spielern, dazu bewusste Schonung der Stars. Die Abwehr war der Anker der französischen Titelserie.',p:'Er gibt Verantwortung an die Spieler ab. Sein Buch über das Verhältnis zwischen Trainer und Spielern heißt „Le règne des affranchis“.'}

  {n:'Gordon Herbert',v:[8,8,7,7,4,3],t:'Klare Rollen nach dem Bild von Schweinen und Rennpferden: Die einen machen die Dreckarbeit, die anderen entscheiden Spiele, und die Besten müssen auch die Dreckarbeit machen. Beim FC Bayern wollte er aggressiver und schneller spielen.',p:'Humorvoll, mit wenigen wichtigen Regeln und viel Eigenverantwortung. Seine drei Prinzipien: pünktlich sein, heute nichts tun, was den Fortschritt von morgen behindert, und professionell sein.'},
  {n:'Phil Jackson',v:[2,6,3,2,8,3],t:'Das Dreieck von Tex Winter: selbstloser Teamangriff, der aus Lesen und Reagieren entsteht. Mit Jordan und später Kobe musste er Stars für das System gewinnen.',p:'Ruhig und ganzheitlich, der „Zen Master“ mit Achtsamkeit und Meditation. Er konnte aber auch fuchsig werden, wenn jemand das System missachtete.'},
  {n:'Gregg Popovich',v:[4,4,4,6,6,2],t:'Teamverteidigung als Fundament: Alle fünf müssen ihre Rotationen erfüllen. Im Angriff ständige Bewegung, jeder offene Spieler kann Hauptoption werden. Später wurde das Spiel schneller und dreierlastiger.',p:'Gradlinig und manchmal ruppig, privat warm und loyal. Er behandelt Spieler wie Erwachsene und baut Vertrauen über gemeinsame Abendessen.'},
  {n:'Mike D’Antoni',v:[10,3,10,2,9,2],t:'„Seven Seconds or Less“: hohes Tempo, Raum, viele Dreier und kleine, schnelle Aufstellungen. Er gab Spielmachern wie Nash oder Harden viel Freiheit.',p:'Bescheiden, ein Tüftler und Innovator. Sein Ansatz ist, die Spieler zu maximieren.'},
  {n:'Steve Kerr',v:[7,5,8,5,9,5],t:'Mischung aus Dreieck, Spacing und Tempo. Warriors mit Top-Verteidigung und Top-Angriff, dazu mutige Anpassungen mitten in Serien, etwa die „Death Lineup“.',p:'Offen und meinungsstark. Er will bei seinen Spielern Freude, Achtsamkeit, Mitgefühl und Wettkampf sehen und gab Assistenten echte Verantwortung.'}

 if(n===4){M.pl.forEach(function(p,i){if(!p.ver.trim()&&!p.k)return;pH3(c,'Meine Rolle für '+(p.k||('Person '+(i+1))));pTracks(c,ROWS.ro,p.ro,['Ich gebe heute','Die Person braucht']);pQ(c,'Das verändere ich',p.ver)})}
 pH2(c,'Meine Reflexion');var r=M.refl;
 pQ(c,'Was nehme ich mit?',r.mit);if(n===1)pQ(c,'Meine wichtigsten Impulse aus anderen Sportarten',(M.ls||{}).fin);pQ(c,'Was hat mich überrascht?',r.ueb);pQ(c,'Was hat mich irritiert oder herausgefordert?',r.schw);pQ(c,'Was mache ich künftig anders?',r.anders);pQ(c,'Was habe ich in diesem Modul über mich als Trainerin oder Trainer gelernt?',r.ich);pQ(c,'Mein Vorsatz',r.vors)}
async function makePDF(n){if(n&&!isOpen(n))return;var c=pNew();if(!c){toast('Der PDF Baustein konnte nicht geladen werden. Bitte Seite neu laden.');return}

  if(n){await pBuild(c,n)}else{var first=true;for(var i=1;i<=4;i++){if(!isOpen(i))continue;if(!first){c.doc.addPage();c.y=c.M}first=false;await pBuild(c,i)}}
  var N=c.doc.getNumberOfPages(),lab=n?'Modul '+n:'Gesamtübersicht';
  for(var p=1;p<=N;p++){c.doc.setPage(p);c.doc.setFont('helvetica','normal');c.doc.setFontSize(8);c.doc.setTextColor(120);c.doc.text('HPSI Coaching Zertifikat 2026/2027, '+lab+', Seite '+p+' von '+N,c.M,c.H-10)}
  var inc=[];for(var q=1;q<=4;q++){if(n?q===n:isOpen(q))inc.push(q)}try{c.doc.setProperties({title:n?'HPSI Modul '+n+', '+MODS[n-1].t:'HPSI Reflexion gesamt',subject:await packData(pdfPayload(inc))})}catch(e){}
  saveFile(n?'HPSI-Modul-'+n+'-'+SLUG[n-1]+'-'+isoDate()+'.pdf':'HPSI-Reflexion-gesamt-'+isoDate()+'.pdf',c.doc.output('blob'))
 }catch(e){toast('PDF konnte nicht erstellt werden: '+e.message)}}

/* ---------- Wiederherstellen aus PDFs ---------- */
var PEND={},PMSG=[];
function b64u(bytes){var bin='',i;for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var bin=atob(t),a=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function packData(obj){var json=JSON.stringify(obj);try{if(typeof CompressionStream!=='undefined'){var cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(json));w.close();return 'HPSIDATA1z:'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}}catch(e){}return 'HPSIDATA1r:'+b64u(new TextEncoder().encode(json))}
async function readPdfData(file){var buf=await file.arrayBuffer(),txt=new TextDecoder('latin1').decode(new Uint8Array(buf)),m=txt.match(/HPSIDATA1([zr]):([A-Za-z0-9_-]+)/);if(!m)return null;var bytes=unb64u(m[2]),json;
 if(m[1]==='z'){var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(bytes);w.close();json=await new Response(ds.readable).text()}else json=new TextDecoder().decode(bytes);
 var o=JSON.parse(json);if(o.a!=='hpsi-reflexion'||!isObj(o.m))return null;return o}
function pdfPayload(nums){var m={};nums.forEach(function(n){var c=JSON.parse(JSON.stringify(S.m[n]));if(n===1)c.files=[];m[n]=c});return {a:'hpsi-reflexion',v:1,t:isoDate(),m:m}}
function secPdfRes(){var keys=Object.keys(PEND),h='<p>Falls deine Einträge nicht mehr im Browser liegen: Lade die PDFs hoch, die du dir aus dieser Seite gespeichert hast. Daraus entsteht dein Weg wieder. Nur PDFs aus dieser Seite enthalten die nötigen Daten, und hochgeladene Bilder und Dateien aus Modul 1 kommen dabei nicht zurück.</p><button class="btn" data-act="pdfpick">PDFs auswählen</button>';
 PMSG.forEach(function(m){h+='<p class="hint" style="margin-top:10px">'+esc(m)+'</p>'});
 if(keys.length){h+='<div class="card" style="margin-top:14px">'+keys.map(function(n){return '<div class="rl">Modul '+n+', '+MODS[n-1].t+'</div><div class="mut" style="margin-bottom:8px">gesichert am '+esc(PEND[n].t)+(isOpen(+n)?'':', noch nicht freigeschaltet')+'</div>'}).join('')+'<p class="hint">Beim Übernehmen werden vorhandene Einträge dieser Module ersetzt.</p><button class="btn" data-act="pdfapply">Übernehmen</button></div>'}
 return h}
async function onPdfs(files){PMSG=[];for(var i=0;i<files.length;i++){var f=files[i];try{var o=await readPdfData(f);if(!o){PMSG.push('Aus "'+f.name+'" konnte ich nichts lesen. Die Datei stammt vermutlich nicht aus dieser Seite oder wurde nachträglich verändert.');continue}
  Object.keys(o.m).forEach(function(n){if(!/^[1-4]$/.test(n)||!isObj(o.m[n]))return;if(!PEND[n]||String(o.t)>=String(PEND[n].t))PEND[n]={t:o.t||'',data:o.m[n]}});}catch(e){PMSG.push('Aus "'+f.name+'" konnte ich nichts lesen.')}}
 if(!Object.keys(PEND).length&&!PMSG.length)PMSG.push('Keine Module gefunden.');refresh('pdfres')}
function applyPdfs(){var done=[];Object.keys(PEND).forEach(function(n){if(!isOpen(+n))return;try{var c=merge(defaults().m[n],PEND[n].data);if(+n===1)c.files=[];S.m[n]=c;done.push(n)}catch(e){}});
 PEND={};PMSG=[];if(!done.length){toast('Dafür war nichts freigeschaltet.');refresh('pdfres');return}norm();S.ui.preview=S.ui.preview;clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}save();render();toast('Wiederhergestellt: Modul '+done.join(', '))}
/* ---------- Dateien hinzufügen ---------- */
function shrink(f){return new Promise(function(res){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);res(b||f)},'image/jpeg',.85)};im.onerror=function(){URL.revokeObjectURL(u);res(f)};im.src=u})}
async function addFiles(list){for(var i=0;i<list.length;i++){var f=list[i];if(S.m[1].files.length>=6){toast('Mehr als sechs Dateien gehen nicht.');break}
 if(f.size>15*1024*1024){toast(f.name+' ist größer als 15 MB.');continue}

 var b=isImg?await shrink(f):f,id=uid();await DB.put(id,b);S.m[1].files.push({id:id,name:f.name,type:b.type||f.type,size:b.size});save();refresh('files')}}

 var b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b)});
function act(a,b){var d=b.dataset,sc=b.closest('[data-sec]'),sn=sc&&sc.dataset.sec;
 switch(a){
 case 'nav':if(/^[1-4]$/.test(d.r)&&!isOpen(+d.r))break;S.ui.route=d.r;save();render();window.scrollTo(0,0);break;

 case 'addblock':S.m[2].ses.push({id:uid(),t:d.t,n:'',min:d.t==='Pause'?5:15,int:d.t==='Pause'||d.t==='Ankommen'?1:3});save();refresh('sess');break;
 case 'tally':var tc=S.m[2].tc;tc[d.k]=Math.max(0,(tc[d.k]||0)+(+d.d));save();refresh('tally');break;
 case 'tsave':var c=S.m[2].tc;if(!((c.fo||0)+(c.fg||0)+(c.an||0)+(c.lo||0)+(c.ko||0)+(c.nk||0))&&!S.m[2].tn.trim()){toast('Zähle zuerst etwas mit.');break}S.m[2].tl.unshift({id:uid(),date:today(),fo:c.fo||0,fg:c.fg||0,an:c.an||0,lo:c.lo||0,ko:c.ko||0,nk:c.nk||0,note:S.m[2].tn});S.m[2].tc={fo:0,fg:0,an:0,lo:0,ko:0,nk:0};S.m[2].tn='';save();refresh('tally');toast('Beobachtung gespeichert');break;
 case 'valt':var v=S.m[1].vals,ix=v.indexOf(d.v);if(ix>-1)v.splice(ix,1);else if(v.length<5)v.push(d.v);else{toast('Maximal fünf Werte. Nimm zuerst einen raus.');break}save();refresh('vals');break;
 case 'valadd':var inp=$('#valIn'),val=inp.value.trim();if(!val)break;if(S.m[1].vals.length>=5){toast('Maximal fünf Werte. Nimm zuerst einen raus.');break}if(S.m[1].vals.indexOf(val)<0)S.m[1].vals.push(val);save();refresh('vals');break;

 case 'dsel':var i2=+d.i;S.m[3].sel=(S.m[3].sel===i2)?null:i2;if(S.m[3].sel!=null&&!S.m[3].dl[i2])S.m[3].dl[i2]={dec:'',gegen:'',c:[5,5,5,5]};save();refresh('dil');break;
 case 'dyadd':S.m[3].dy.unshift({id:uid(),date:today(),sit:'',tat:'',wirk:'',next:''});save();refresh('diary');break;
